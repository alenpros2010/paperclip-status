name: Plugin checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/tech-debt-v1-1]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked plugin dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Install exact supported host SDK (no lifecycle scripts)
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps openclaw@2026.10.6
      - run: npm run typecheck
      - run: npm test
